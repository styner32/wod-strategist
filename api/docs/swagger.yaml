        type: number
      rest_elapsed_seconds:
        type: number
      rest_end_secs:
        type: number
      rest_start_secs:
        type: number
    type: object
host: localhost:8088
info:
  contact: {}
  description: API for WOD Strategist application.
  title: WOD Strategist API
  version: "1.0"
paths:
  /appearance-from-image:
    post:
      consumes:
      - multipart/form-data
      description: Extracts person visual appearance cues from a photo
      parameters:
      - description: Person photo (JPEG/PNG, max 10MB)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.AppearanceInput'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Parse Appearance Image
      tags:
      - workout
  /chunk-analysis/:session_id:
    get:
      description: Fetches the partial analysis chunks for a given session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.ChunkAnalysisResult'
            type: array
      summary: Get Chunk Analysis
      tags:
      - analysis
  /chunk-complete:
    post:
      consumes:
      - application/json
      description: Notifies the backend that a chunk upload is complete and triggers
        chunk analysis
      parameters:
      - description: Upload metadata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.ChunkCompleteRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/controllers.CompleteUploadResponse'
      summary: Chunk Complete
      tags:
      - upload
  /debug/telemetry:
    post:
      consumes:
      - application/json
      description: Receives a telemetry session from the app and stores it in GCS
        for debugging
      parameters:
      - description: Telemetry session
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controllers.DebugTelemetryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Upload Debug Telemetry
      tags:
      - debug
  /dev/sessions:
    get:
      description: Lists existing sessions discovered from uploaded storage assets
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.SessionCatalogResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: List Session Catalog
      tags:
      - dev
  /dev/sessions/{session_id}/assets:
    get:
      description: Lists playable session assets for the browser QA workbench
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.SessionAssetsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Get Session Assets
      tags:
      - dev
  /dev/sessions/{session_id}/play-url:
    get:
      description: Resolves a playable signed URL for a session asset
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Asset kind
        in: query
        name: kind
        required: true
        type: string
      - description: Asset variant
        in: query
        name: variant
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PlayURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Get Session Play URL
      tags:
      - dev
  /highlight-download/:id:
    get:
      description: Returns a time-limited signed URL for downloading a specific highlight
        video
      parameters:
      - description: Highlight result ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.VideoDownloadURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Get Highlight Download URL
      tags:
      - highlight
  /highlight/:session_id:
    get:
      description: Returns highlight generation results for a given session
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/db.HighlightResult'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Get Highlight
      tags:
      - highlight
  /injuries:
    get:
      description: Returns a list of all supported injuries that can be analyzed
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: List supported injuries
      tags:
      - metadata
  /merge-chunks:
    post:
      consumes:
      - application/json
      description: Triggers server-side merging of all uploaded chunks for a session,
        then runs full video analysis
      parameters:
      - description: Session and workout metadata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.MergeChunksRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/controllers.MergeChunksResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Merge Chunks
      tags:
      - upload
  /movement-groups:
    get:
      description: Returns all supported workout movements organized by category
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/controllers.MovementGroup'
            type: array
      summary: List movement groups
      tags:
      - metadata
  /movements:
    get:
      description: Returns a list of all supported workout movements
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: List supported movements
      tags:
      - metadata
  /parse-workout-image:
    post:
      consumes:
      - multipart/form-data
      description: Extracts workout description and movements from a whiteboard photo
      parameters:
      - description: Whiteboard photo (JPEG/PNG, max 10MB)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.ParseWorkoutImageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Parse Workout Image
      tags:
      - workout
  /performance-benchmarks:
    get:
      parameters:
      - description: Owned profile ID
        in: query
        name: profile_id
        required: true
        type: integer
      - description: Canonical movement or recognized alias
        in: query
        name: movement
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PerformanceBenchmarksResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get confirmed workout performance benchmarks
      tags:
      - analysis
  /related-wods:
    get:
      description: Returns nearest past WODs of the same profile containing the specified
        movement, ranked by recency, weight match, and main movement status.
      parameters:
      - description: Profile ID
        in: query
        name: profile_id
        required: true
        type: integer
      - description: Movement name (Mode A)
        in: query
        name: movement
        type: string
      - description: Movement weight in kg (Mode A)
        in: query
        name: weight_kg
        type: number
      - description: Anchor session ID (Mode B)
        in: query
        name: session_id
        type: string
      - description: Max results (default 5, max 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.RelatedWODsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Get Related WODs
      tags:
      - wod
  /sessions/{session_id}/activity-summary:
    get:
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Owned profile ID
        in: query
        name: profile_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/activity.Summary'
      summary: Get observed workout activity
      tags:
      - analysis
  /sessions/{session_id}/performance-records:
    put:
      consumes:
      - application/json
      parameters:
      - description: Owned session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Confirm interval, window, outcome, optional integer reps and
          actual load (or explicit null for no external load)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.PerformanceRecordsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.WorkoutProgressResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Confirm workout performance records
      tags:
      - analysis
  /sessions/{session_id}/recognition-evaluation:
    get:
      parameters:
      - description: Owned session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/recognitionreview.Evaluation'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Compare confirmed performance with original video recognition
      tags:
      - analysis
  /sessions/{session_id}/recognition-reviews:
    get:
      parameters:
      - description: Owned session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.ListRecognitionReviewsResponse'
      summary: List recognition diagnoses
      tags:
      - analysis
    post:
      consumes:
      - application/json
      parameters:
      - description: Owned session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Confirmed records and review range
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateRecognitionReviewRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/controllers.CreateRecognitionReviewResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Manually diagnose selected video recognition errors
      tags:
      - analysis
  /sessions/{session_id}/recognition-reviews/{run_id}:
    get:
      parameters:
      - description: Owned session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Diagnosis ID
        in: path
        name: run_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.RecognitionReviewRunResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a recognition diagnosis
      tags:
      - analysis
  /sessions/{session_id}/workout-progress:
    get:
      parameters:
      - description: Owned session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.WorkoutProgressResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get chronological workout observations
      tags:
      - analysis
  /strategies/pre-wod-advice:
    post:
      consumes:
      - application/json
      description: Calculates 6-muscle group readiness from recent workouts and returns
        tailored coaching advice for today's WOD.
      parameters:
      - description: Pre-WOD Advice Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.PreWODAdviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.PreWODAdviceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'

      tags:
      - upload
  /upload-url:
    post:
      consumes:
      - application/json
      description: Generates a signed GCS upload URL for a specific video file
      parameters:
      - description: Session and filename
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.CreateUploadURLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.CreateUploadURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Create Upload URL
      tags:
      - upload
  /video-download/:session_id:
    get:
      description: Returns a time-limited signed URL for one requested video kind
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: 'Video kind: merged (default), hardsubbed, or encoded'
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controllers.VideoDownloadURLResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Get Video Download URL
      tags:
      - video

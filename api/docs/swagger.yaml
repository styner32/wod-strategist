      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: SRT subtitle content
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controllers.ErrorResponse'
      summary: Get Subtitles
      tags:
      - analysis
  /upload-complete:
    post:
      consumes:
      - application/json
      description: Notifies the backend that a video upload is complete and triggers
